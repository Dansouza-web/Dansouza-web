<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 64" width="1000" height="64" role="img" aria-labelledby="t">
<title id="t">Ferramentas</title>
<defs>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
<feGaussianBlur stdDeviation="3.5" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset=".6" stop-color="#7A00FF"/><stop offset="1" stop-color="#FF007F" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1000" height="64" rx="10" fill="#050816"/>
<g font-family="'Fira Code','JetBrains Mono','Cascadia Code','Courier New',monospace" xml:space="preserve">
<text x="12" y="42" font-size="28" font-weight="700"><tspan fill="#FF007F">&gt; </tspan><tspan fill="#FFFFFF" filter="url(#glow)">STACK</tspan><tspan fill="#00F0FF">_<animate attributeName="fill-opacity" calcMode="discrete" values="1;0" keyTimes="0;.5" dur="1.1s" repeatCount="indefinite"/></tspan></text>
<text x="992" y="40" font-size="16" text-anchor="end" fill="#A66BFF" letter-spacing="2">03/06</text>
</g>
<rect x="162" y="33" width="748" height="2" fill="url(#ln)"/>
<circle cy="34" r="3.5" fill="#00F0FF" filter="url(#glow)"><animate attributeName="cx" values="162;900" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" keyTimes="0;.85;1" dur="3.2s" repeatCount="indefinite"/></circle>
<rect x="8" y="58" width="984" height="1" fill="#7A00FF" opacity=".35"/>
</svg>
