name: Gerar cobrinha das contribuições
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  gerar-cobrinha:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar o SVG da cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-custom.svg?color_snake=#FF007F&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
